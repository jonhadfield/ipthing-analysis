[project]
name = "ipthing-analysis"
version = "0.1.0"
description = "Public analysis of traffic hitting ipthing.net — graphs, tables, and narrative."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jinja2>=3.1",
    "pandas>=2.2",
    "plotly>=5.24",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
]

[project.scripts]
ipthing-report = "ipthing_analysis.build:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ipthing_analysis"]
